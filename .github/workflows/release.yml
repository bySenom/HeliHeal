name: Release Addon

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.1 zip

      - name: Verify version tag
        shell: bash
        run: |
          version="$(sed -n 's/^## Version: //p' HeliHeal.toc | tr -d '\r')"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Run Lua tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.lua; do
            lua5.1 "${test_file}"
          done

      - name: Build addon package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/HeliHeal
          cp AbilityLibrary.lua Changelog.lua Core.lua Defaults.lua Display.lua HeliHeal.toc Input.lua LICENSE Localization.lua Namespace.lua Options.lua README.md TalentSnapshot.lua dist/HeliHeal/
          mkdir -p dist/HeliHeal/Libs
          cp -R Classes dist/HeliHeal/
          mkdir -p dist/HeliHeal/Media
          cp Media/HeliHealIcon.tga dist/HeliHeal/Media/
          cp -R Libs/LibStub Libs/CallbackHandler-1.0 Libs/AceAddon-3.0 Libs/AceConsole-3.0 Libs/AceDB-3.0 dist/HeliHeal/Libs/
          cd dist
          zip -r "HeliHeal-${GITHUB_REF_NAME}.zip" HeliHeal
          sha256sum "HeliHeal-${GITHUB_REF_NAME}.zip" > "HeliHeal-${GITHUB_REF_NAME}.zip.sha256"

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail
          test -s CHANGELOG.md
          cp CHANGELOG.md dist/release-notes.md

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/HeliHeal-${GITHUB_REF_NAME}.zip" \
            "dist/HeliHeal-${GITHUB_REF_NAME}.zip.sha256" \
            --title "HeliHeal ${GITHUB_REF_NAME#v}" \
            --notes-file dist/release-notes.md \
            --prerelease
