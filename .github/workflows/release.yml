name: Release Addon

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.1 zip

      - name: Verify version tag
        shell: bash
        run: |
          version="$(sed -n 's/^## Version: //p' HeliHeal.toc | tr -d '\r')"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Run Lua tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.lua; do
            lua5.1 "${test_file}"
          done

      - name: Build addon package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/HeliHeal
          cp AbilityLibrary.lua BETA_TESTING.md Core.lua Defaults.lua Display.lua HeliHeal.toc Input.lua LICENSE Namespace.lua Options.lua README.md TalentSnapshot.lua dist/HeliHeal/
          cp -R Classes Libs Media dist/HeliHeal/
          cd dist
          zip -r "HeliHeal-${GITHUB_REF_NAME}.zip" HeliHeal
          sha256sum "HeliHeal-${GITHUB_REF_NAME}.zip" > "HeliHeal-${GITHUB_REF_NAME}.zip.sha256"

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/HeliHeal-${GITHUB_REF_NAME}.zip" \
            "dist/HeliHeal-${GITHUB_REF_NAME}.zip.sha256" \
            --title "HeliHeal ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --prerelease
